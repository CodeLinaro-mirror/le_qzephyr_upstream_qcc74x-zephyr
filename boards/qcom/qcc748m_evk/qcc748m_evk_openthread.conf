# Enable QCC748 OpenThread support using the OpenThread source managed by West.
CONFIG_IEEE802154=y
CONFIG_IEEE802154_QCC74X=y
CONFIG_NET_L2_OPENTHREAD=y
CONFIG_OPENTHREAD=y
CONFIG_OPENTHREAD_SOURCES=y
CONFIG_OPENTHREAD_PING_SENDER=y
CONFIG_OPENTHREAD_THREAD_VERSION_1_1=n
CONFIG_OPENTHREAD_THREAD_VERSION_1_3=y
CONFIG_OPENTHREAD_LINK_METRICS_INITIATOR=y
CONFIG_OPENTHREAD_LINK_METRICS_SUBJECT=y
CONFIG_PSA_CRYPTO_DRIVER_QCC74X=n
CONFIG_FLASH=y
CONFIG_SOC_FLASH_QCC74X=y
