# Compile-time coverage for the link-complete antenna-diversity core.
# The RF-switch GPIO overlay is required when antenna diversity is enabled.
#
# The BL v2.1.12 QCC743 archives do not export the CSI-DMA command handlers
# (cmd_csidma_*), nor the static antenna scan handlers.  Keep those optional
# front ends disabled until BL publishes matching archives; see the release
# note for the tracked packaging issue.
CONFIG_QCC74X_WIFI_ANTENNA_DIVERSITY=y
CONFIG_QCC74X_WIFI_ANTENNA_DIVERSITY_STATIC=n
CONFIG_QCC74X_WIFI_ANTENNA_DIVERSITY_DYNAMIC=y
CONFIG_QCC74X_WIFI_ANTENNA_DIVERSITY_SHELL=y
