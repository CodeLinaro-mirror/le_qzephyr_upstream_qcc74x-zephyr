# Used by QCC-IDE: combines openocd.cfg (CH347 interface) + qcc748m.cfg (RISC-V target)
# so that a single -f <path> can be passed to openocd, matching qcc730's combined-cfg pattern.

# ---- interface: CH347 (from openocd.cfg) ----
# For the provided CH347

adapter driver ch347
ch347 vid_pid 0x1a86 0x55de

adapter speed 1000

transport select jtag

# ---- target: RISC-V (from qcc748m.cfg) ----
# Copyright (c) 2025-2026 MASSDRIVER EI (massdriver.space)
