[cfg]
# 0: no erase, 1:programmed section erase, 2: chip erase
erase = 1
# skip mode set first para is skip addr, second para is skip len, multi-segment region with ; separated
skip_mode = 0x0, 0x0
# 0: not use isp mode, #1: isp mode
boot2_isp_mode = 0

# filedir(s) are updated dynamically in qconn_flash_runner python script. Dot is only placeholder.

[boot2]
filedir = .
address = 0x000000

[partition]
filedir = .
address = 0xE000

[partition1]
filedir = .
address = 0xF000

[FW]
filedir = .
address = 0x10000