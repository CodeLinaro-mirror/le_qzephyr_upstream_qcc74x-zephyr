description: Qualcomm Opal family SPI controller

compatible: "qcom,qcc74x-spi"

include: [spi-controller.yaml, pinctrl-device.yaml, reset-device.yaml]

properties:
  reg:
    required: true

  interrupts:
    required: true

  pinctrl-0:
    required: true

  pinctrl-names:
    required: true

  clocks:
    required: true

  resets:
    required: true

  dmas:
    description: |
      DMA channels for TX and RX operations.
      First cell specifies the channel number, 
      Second cell specifies the slot 
      Third cell specifies the peripheral FIFO address.

  dma-names:
    description: |
      Should be "tx" and "rx" for transmit and receive DMA channels.
