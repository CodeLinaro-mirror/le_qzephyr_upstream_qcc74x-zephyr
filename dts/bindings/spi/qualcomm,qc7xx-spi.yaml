description: QUALCOMM SPI

compatible: "qualcomm,qc7xx-spi"

include: [spi-controller.yaml, reset-device.yaml, pinctrl-device.yaml]

properties:
  reg:
    required: true

  peripheral_name:
    type: string
    required: true

  interrupts:
    required: true

  clocks:
    required: true

  pinctrl-0:
    required: true

  pinctrl-names:
    required: true

  dmas:
    description: |
      TX & RX dma specifiers.  Each specifier will have a phandle
      reference to the dma controller, the channel number, peripheral
      trigger source, and peripheral fifo address. The channel number
      is arbitrary but must not be reused. The number of channels
      available is device dependent.

      For example dmas for TX and RX may look like
        dmas = <&dma 2  DMA_REQUEST_SPI0_TX  DMA_ADDR_SPI0_TDR>,
               <&dma 3  DMA_REQUEST_SPI0_RX  DMA_ADDR_SPI0_RDR>;

  dma-names:
    description: |
      This should be "tx" and "rx" and should match the order given for
      dmas.

      For example using the example dmas, an example dma-names would be
         dma-names = "tx", "rx";
