description: Qualcomm Opal family I2S controller

compatible: "qcom,qcc74x-i2s"

include: [i2s-controller.yaml, pinctrl-device.yaml, reset-device.yaml]

properties:
  reg:
    required: true

  pinctrl-0:
    required: true

  pinctrl-names:
    required: true

  interrupts:
    required: true

  interrupt-parent:
    required: true

  resets:
    required: true

  dmas:
    required: true
    description: |
      TX & RX dma specifiers.  Each specifier will have a phandle
      reference to the dma controller, the channel number, peripheral
      trigger source, and peripheral fifo address. The channel number
      is arbitrary but must not be reused. The number of channels
      available is device dependent.

      For example dmas for TX and RX may look like
      dmas = <&dma 0  DMA_REQUEST_I2S_TX  DMA_ADDR_I2S_TDR>,
             <&dma 1  DMA_REQUEST_I2S_RX  DMA_ADDR_I2S_RDR>;

  dma-names:
    required: true
    description: |
      This should be "tx" and "rx" and should match the order given for
      dmas.

      For example using the example dmas, an example dma-names would be
         dma-names = "tx", "rx";

  diclk:
    required: true
    type: int
    default: 0
    description: |
      Property indicating if DI pin will serve as DI input or ref clk output.

  doclk:
    required: true
    type: int
    default: 0
    description: |
      Property indicating if DO pin will serve as DO output or ref clk output.

  div:
    required: true
    type: int
    default: 0
    description: |
      Value of the clock divider. Should be less or equal to 0x3F.

  slave-mode:
    type: boolean
    description: |
      If present, the I2S controller operates in slave mode: BCLK and LRCLK
      are driven by an external master (e.g. a codec in master mode).
      If absent (default), the controller operates in master mode and
      generates BCLK and LRCLK itself.
