description: QUALCOMM I2S

compatible: "qualcomm,qc7xx-i2s"

include: [i2s-controller.yaml, pinctrl-device.yaml]

properties:
  reg:
    required: true

  peripheral_name:
    type: string
    required: true

  pinctrl-0:
    required: true

  pinctrl-names:
    required: true

  clocks:
    required: true

  interrupts:
    required: true

  interrupt-parent:
    required: true

  dmas:
    required: true
    description: |
      TX & RX dma specifiers.  Each specifier will have a phandle
      reference to the dma controller, the channel number, peripheral
      trigger source, and peripheral fifo address. The channel number
      is arbitrary but must not be reused. The number of channels
      available is device dependent.

      For example dmas for TX and RX may look like
      dmas = <&dma 0  DMA_REQUEST_I2S_TX  DMA_ADDR_I2S_TDR>,
             <&dma 1  DMA_REQUEST_I2S_RX  DMA_ADDR_I2S_RDR>;

  dma-names:
    required: true
    description: |
      This should be "tx" and "rx" and should match the order given for
      dmas.

      For example using the example dmas, an example dma-names would be
         dma-names = "tx", "rx";

  "#clock-cells":
    type: int
    const: 0

  "#sound-dai-cells":
    type: int
    const: 0

  format:
    type: string
    required: false
    enum: ["i2s", "left_j", "right_j", "pcm_a", "pcm_b"]
    description: Audio format used by the I2S interface

  bit-clock-direction:
    type: string
    required: false
    enum: ["input", "output"]
    description: Direction of the bit clock

  frame-clock-direction:
    type: string
    required: false
    enum: ["input", "output"]
    description: Direction of the frame clock

  slot-width:
    type: int
    required: false
    enum: [8, 16, 20, 24, 32]
    description: Width of each audio slot in bits

  bit-clock-master:
    type: boolean
    required: false
    description: |
      Whether the I2S interface is the bit clock master. If true,
      the I2S interface generates the bit clock (BCLK). If false,
      it uses an external bit clock.

  frame-clock-master:
    type: boolean
    required: false
    description: |
      Whether the I2S interface is the frame clock master. If true,
      the I2S interface generates the frame clock (LRCK/WS). If false,
      it uses an external frame clock.

