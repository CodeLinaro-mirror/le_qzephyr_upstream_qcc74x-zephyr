description: Qualcomm Opal family ADC controller

compatible: "qcom,qcc74x-adc"

include: [adc-controller.yaml, pinctrl-device.yaml]

properties:
  clk_div:
    type: int
    required: true
    description: ADC clock division ratio.
      Possible values are 4, 8, 12, 16, 20, 24, 32.

  "#io-channel-cells":
    const: 1

io-channel-cells:
  - input
