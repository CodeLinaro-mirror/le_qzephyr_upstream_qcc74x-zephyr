description: Qualcomm Opal family audio DAC

compatible: "qcom,qcc74x-audio-dac"

include: [base.yaml, pinctrl-device.yaml]

properties:
  clk_div:
    type: int
    required: true
    description: Audio DAC clock division ratio.
      Should be less or equal 0xFF (255 dec).