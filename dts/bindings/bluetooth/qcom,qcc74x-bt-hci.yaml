description: Qualcomm Opal family Bluetooth HCI controller

compatible: "qcom,qcc74x-bt-hci"

include: [bt-hci.yaml, reset-device.yaml]

properties:
  bt-hci-name:
    default: "BT qcc74x"
  bt-hci-bus:
    default: "virtual"
  resets:
    required: true
