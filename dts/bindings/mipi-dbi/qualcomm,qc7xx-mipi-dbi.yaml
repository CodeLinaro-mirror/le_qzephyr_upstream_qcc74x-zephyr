# SPDX-License-Identifier: Apache-2.0

description:
  Qualcomm QC7XX DBI display controller

compatible: "qualcomm,qc7xx-mipi-dbi"

include: [mipi-dbi-controller.yaml, pinctrl-device.yaml]

properties:
  reg:
    required: true

  peripheral_name:
    type: string
    required: true

  pinctrl-0:
    required: true

  pinctrl-names:
    required: true

  clocks:
    required: true

  interrupts:
    required: true

  interrupt-parent:
    required: true

  reset-gpios:
    type: phandle-array
    description: |
      Reset GPIO pin. Used to reset the display during initialization.

  mipi-mode:
    type: string
    description: |
      MIPI DBI mode in use. These definitions should match those in
      dt-bindings/mipi_dbi/mipi_dbi.h
    enum:
      - "MIPI_DBI_MODE_SPI_3WIRE"
      - "MIPI_DBI_MODE_SPI_4WIRE"
      - "MIPI_DBI_MODE_8080_BUS_8_BIT"

  dmas:
    description: |
      TX & RX dma specifiers.  Each specifier will have a phandle
      reference to the dma controller, the channel number, peripheral
      trigger source, and peripheral fifo address. The channel number
      is arbitrary but must not be reused. The number of channels
      available is device dependent.

      For example dmas for TX and RX may look like
      dmas = <&dma 3  DMA_REQUEST_DBI_TX  DMA_ADDR_DBI_TDR>;



