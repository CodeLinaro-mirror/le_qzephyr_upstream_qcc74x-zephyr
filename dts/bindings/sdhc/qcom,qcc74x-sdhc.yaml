description: Qualcomm Opal family SDHC controller

compatible: "qcom,qcc74x-sdhc"

include: [sdhc.yaml, pinctrl-device.yaml, reset-device.yaml]

properties:
  reg:
    required: true

  pinctrl-0:
    required: true

  pinctrl-names:
    required: true

  clocks:
    required: true

  interrupts:
    required: true

  bus-width:
    type: int
    default: 4
    description: |
      The bus width of the SDHC controller. The value should be 1 or 4.

  resets:
    required: true
