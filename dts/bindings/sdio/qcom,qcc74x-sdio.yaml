description: Qualcomm Opal family SDIO controller

compatible: "qcom,qcc74x-sdio"

bus: sdio

include: [pinctrl-device.yaml, base.yaml, reset-device.yaml]

properties:
  reg:
    required: true

  pinctrl-0:
    required: true

  pinctrl-names:
    required: true

  download-size-max:
    type: int
    default: 2048

  clocks:
    required: true

  resets:
    required: true

  "#address-cells":
    required: true
    const: 1

  "#size-cells":
    required: true
    const: 0
 
