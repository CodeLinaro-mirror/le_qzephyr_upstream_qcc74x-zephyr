description: Qualcomm MDIO controller

compatible: "qualcomm,qc7xx-mdio"

include: [mdio-controller.yaml, pinctrl-device.yaml]

properties:
  pinctrl-0:
    required: true

  pinctrl-names:
    required: true

  clocks:
    required: true

  clk_div:
    type: int
    required: true
