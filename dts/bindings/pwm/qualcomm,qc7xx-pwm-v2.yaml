description: QUALCOMM PWM V2

compatible: "qualcomm,qc7xx-pwm-v2"

include: [pwm-controller.yaml, pinctrl-device.yaml, reset-device.yaml, base.yaml]

properties:
  reg:
    required: true

  peripheral_name:
    type: string
    required: true

  interrupts:
    required: true

  prescaler:
    type: int
    required: true
    description: PWM prescaler. Defaults to 0 (SoC default).

  channels:
    type: int
    required: true
    description: Number of channels this PWM has
    enum:
      - 4

  "#pwm-cells":
    const: 3

pwm-cells:
  # The rpi pico pwm peripheral is divided in 8 slices with an individual
  # clock setting and two output channels. The pwm channels are mapped the
  # following way PWM_CH0_A is addressed as <&pwm 0 PWM_FLAGS>, PWM_CH0B
  # is <&pwm 1 PMW_FLAGS>, PWM_CH1_A si <&pwm 2 PWM_FLAGS> and so on.
  - channel
  - period
  - flags