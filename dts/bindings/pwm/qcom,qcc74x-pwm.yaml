description: Qualcomm Opal family PWM controller

compatible: "qcom,qcc74x-pwm"

include: [pwm-controller.yaml, pinctrl-device.yaml, reset-device.yaml, base.yaml]

properties:
  reg:
    required: true

  interrupts:
    required: true

  clocks:
    required: true

  resets:
    required: true

  divider:
    type: int
    required: true
    description: 16 bit Clock divider, up to 65535 divisions

  pinctrl-0:
    required: true

  "#pwm-cells":
    const: 3

pwm-cells:
  - channel
  - period
  - flags
