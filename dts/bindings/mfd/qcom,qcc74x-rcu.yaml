description: |
  Qualcomm Opal family Reset and Clock Unit (RCU) if a multi-function peripheral
  in charge of reset control (RCTL) and clock control (CCTL) for all SoC
  peripherals. Child nodes are used to represent each functional block.

compatible: "qcom,qcc74x-rcu"

include: base.yaml

properties:
  reg:
    required: true
