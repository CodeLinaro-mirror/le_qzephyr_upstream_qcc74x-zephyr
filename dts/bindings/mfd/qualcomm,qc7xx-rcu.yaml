description: |
  Qualcomm Reset and Clock Unit (RCU) if a multi-function peripheral in
  charge of reset control (RCTL) and clock control (CCTL) for all SoC
  peripherals. Child nodes are used to represent each functional block.

compatible: "qualcomm,qc7xx-rcu"

include: base.yaml

properties:
  reg:
    required: true
