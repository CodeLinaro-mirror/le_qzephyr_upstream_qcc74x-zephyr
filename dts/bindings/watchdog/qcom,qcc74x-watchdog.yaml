description: Qualcomm Opal family watchdog controller

compatible: "qcom,qcc74x-watchdog"

include: [reset-device.yaml, base.yaml]

properties:
  reg:
    required: true

  clocks:
    required: true

  clock-div:
    type: int
    default: 19
    description: Watchdog prescaler.

  resets:
    required: true
