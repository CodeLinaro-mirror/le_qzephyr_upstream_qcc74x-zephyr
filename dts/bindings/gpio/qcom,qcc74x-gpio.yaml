description: Qualcomm Opal family GPIO controller

compatible: "qcom,qcc74x-gpio"

include: [gpio-controller.yaml, base.yaml]

properties:
  reg:
    required: true

  interrupts:
    required: true

  "#gpio-cells":
    const: 2

  "#qcom,pin-cells":
    type: int
    const: 2

gpio-cells:
  - pin
  - flags

qcom,pin-cells:
  - pin
  - peripheral
